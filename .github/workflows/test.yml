name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate the plugin manifest and module
        run: claude plugin validate --strict .

      # Mods are early access, and the runner has no credentials or settings of
      # its own, so the tests need the switch turned on explicitly. Without it
      # the command exits 1 on the early-access notice, which keeps CI honest.
      - name: Run the plugin's tests
        env:
          CLAUDE_CODE_ENABLE_FUNCTION_HOOKS: "1"
        run: claude plugin test .
